name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Tag must be vMAJOR.MINOR.PATCH, got: $tag" }
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test PS5Craft.slnx -c Release --nologo

      # Framework-dependent keeps the ZIP small; users install .NET 10 Desktop Runtime once.
      - name: Publish slim win-x64 package
        shell: pwsh
        run: |
          ./scripts/publish-release.ps1 -Configuration Release
          # Stamp version into already-published binaries via rebuild if needed
          (Get-Item PS5Craft-win-x64.zip).Length
          Get-Content PS5Craft-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PS5Craft ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Требования
            - Windows 10/11 x64
            - [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (Windows Desktop)

            Распакуйте `PS5Craft-win-x64.zip` и запустите `PS5Craft.exe`.
          files: |
            PS5Craft-win-x64.zip
            PS5Craft-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
