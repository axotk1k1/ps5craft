name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compile-time dependency for FpkgService (local clones are gitignored as _refs/).
      - name: Checkout PSVIETHOA FPKG Builder
        uses: actions/checkout@v4
        with:
          repository: thanhsondev/PSVIETHOA-FPKG-Builder
          ref: 4832a68077d427d831468d313733555172888b6d
          path: _refs/PSVIETHOA-FPKG-Builder

      # Source for bundled mkpfs.exe (GPL-3.0).
      - name: Checkout MkPFS
        uses: actions/checkout@v4
        with:
          repository: PSBrew/MkPFS
          ref: 78eda0a0d1208fdf72a824c8a233b42c1f3542ae
          path: _refs/MkPFS

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Tag must be vMAJOR.MINOR.PATCH, got: $tag" }
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build mkpfs.exe
        shell: pwsh
        run: ./scripts/build-mkpfs.ps1

      - name: Publish fpkg-cli into tools/fpkg
        shell: pwsh
        run: |
          $out = Join-Path $PWD "tools\fpkg"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish "_refs\PSVIETHOA-FPKG-Builder\src\PsViethoa.FpkgBuilder.Cli\PsViethoa.FpkgBuilder.Cli.csproj" `
            -c Release -r win-x64 --self-contained false -o $out
          if ($LASTEXITCODE -ne 0) { throw "fpkg-cli publish failed" }
          if (-not (Test-Path (Join-Path $out "fpkg-cli.exe"))) { throw "fpkg-cli.exe missing after publish" }

      - name: Test
        run: dotnet test tests/PS5Craft.Tests/PS5Craft.Tests.csproj -c Release --nologo -p:WarningLevel=3
        # Test project only (not the whole .slnx) so WPF App is not built during CI test.

      # Framework-dependent keeps the ZIP small; users install .NET 10 Desktop Runtime once.
      # Pass -Version so the baked-in AppVersion matches the GitHub tag (updater uses tag > current).
      - name: Publish slim win-x64 package
        shell: pwsh
        run: |
          ./scripts/publish-release.ps1 -Configuration Release -Version "${{ steps.ver.outputs.version }}"
          (Get-Item PS5Craft-win-x64.zip).Length
          Get-Content PS5Craft-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PS5Craft ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Требования
            - Windows 10/11 x64
            - [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (Windows Desktop)

            Распакуйте `PS5Craft-win-x64.zip` и запустите `PS5Craft.exe`.
          files: |
            PS5Craft-win-x64.zip
            PS5Craft-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
