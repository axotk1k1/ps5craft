name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Tag must be vMAJOR.MINOR.PATCH, got: $tag" }
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test PS5Craft.slnx -c Release --nologo

      - name: Publish PS5Craft win-x64 (self-contained)
        run: >
          dotnet publish src/PS5Craft.App/PS5Craft.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Publish updater (self-contained single-file)
        run: >
          dotnet publish src/PS5Craft.Updater/PS5Craft.Updater.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/updater

      - name: Stage updater into package
        shell: pwsh
        run: |
          Copy-Item publish/updater/PS5Craft.Updater.exe publish/win-x64/PS5Craft.Updater.exe -Force
          Get-ChildItem publish/win-x64 | Select-Object Name, Length | Format-Table

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $zip = "PS5Craft-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path "PS5Craft-win-x64.zip.sha256" -Value "$hash  $zip" -NoNewline
          "ZIP size=$((Get-Item $zip).Length) sha256=$hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PS5Craft ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            PS5Craft-win-x64.zip
            PS5Craft-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
